name: Agent dispatch

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "agent-dispatch-${{ github.event.issue.id || github.run_id }}"
  cancel-in-progress: false

jobs:
  dispatch:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'agent:ready')"
    runs-on: ubuntu-latest
    environment: agent-workers
    steps:
      - uses: actions/checkout@v6
      - name: Capture and validate issue contract
        id: contract
        if: "github.event_name == 'issues'"
        env:
          ISSUE_BODY: "${{ github.event.issue.body }}"
        run: |
          python -c "import os,pathlib; pathlib.Path('issue-body.md').write_text(os.environ['ISSUE_BODY'], encoding='utf-8')"
          python .agent-orchestrator/scripts/parse_task.py --body-file issue-body.md --out task.json --github-output "$GITHUB_OUTPUT"
      - name: Validate explicit dispatch contract
        if: "github.event_name == 'workflow_dispatch'"
        run: python .agent-orchestrator/scripts/validate_repo.py

      - name: Resolve durable dependency states
        if: "github.event_name == 'issues'"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python .agent-orchestrator/scripts/github_ledger.py --repo "$GITHUB_REPOSITORY" --out dependency-states.json dependencies --task task.json
      - name: Gate dependencies
        id: dependencies
        if: "github.event_name == 'issues'"
        run: python .agent-orchestrator/scripts/dependency_gate.py --task task.json --states dependency-states.json --out dependency-gate.json --github-output "$GITHUB_OUTPUT" --soft
      - name: Publish blocked state
        if: "github.event_name == 'issues' && steps.dependencies.outputs.ready != 'true'"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python .agent-orchestrator/scripts/github_ledger.py --repo "$GITHUB_REPOSITORY" state --issue "${{ github.event.issue.number }}" --task-id "${{ steps.contract.outputs.task_id }}" --state blocked --summary "One or more dependencies are not accepted."

      - name: Claim canonical task ledger
        id: claim
        if: "github.event_name == 'issues' && steps.dependencies.outputs.ready == 'true'"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          WORKER: "${{ vars.RWR_LIVE_WORKER == 'true' && 'deepseek' || 'fake' }}"
        run: python .agent-orchestrator/scripts/github_ledger.py --repo "$GITHUB_REPOSITORY" --out ledger-claim.json --github-output "$GITHUB_OUTPUT" claim --issue "${{ github.event.issue.number }}" --task task.json --worker "$WORKER"
      - name: Record paid boundary before provider request
        if: "github.event_name == 'issues' && steps.claim.outputs.dispatchable == 'true' && vars.RWR_LIVE_WORKER == 'true'"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python .agent-orchestrator/scripts/github_ledger.py --repo "$GITHUB_REPOSITORY" mark-paid --issue "${{ github.event.issue.number }}" --task-id "${{ steps.contract.outputs.task_id }}"
      - name: Dry-run worker by default
        id: fake-worker
        if: "github.event_name == 'issues' && steps.claim.outputs.dispatchable == 'true' && vars.RWR_LIVE_WORKER != 'true'"
        run: python .agent-orchestrator/scripts/run_worker.py --task task.json --adapter fake --claim-dir .rwr-state/claims --out worker-result.json
      - name: Explicitly enabled DeepSeek worker
        id: deepseek-worker
        if: "github.event_name == 'issues' && steps.claim.outputs.dispatchable == 'true' && vars.RWR_LIVE_WORKER == 'true'"
        continue-on-error: true
        env:
          RWR_ALLOW_LIVE: "1"
          DEEPSEEK_API_KEY: "${{ secrets.DEEPSEEK_API_KEY }}"
        run: python .agent-orchestrator/scripts/run_worker.py --task task.json --adapter deepseek --claim-dir .rwr-state/claims --out worker-result.json
      - name: Finalize canonical task ledger
        if: "always() && github.event_name == 'issues' && steps.claim.outputs.dispatchable == 'true'"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: python .agent-orchestrator/scripts/github_ledger.py --repo "$GITHUB_REPOSITORY" finalize --issue "${{ github.event.issue.number }}" --task-id "${{ steps.contract.outputs.task_id }}" --worker-result worker-result.json
      - name: Preserve result evidence
        if: "always() && github.event_name == 'issues' && steps.claim.outputs.dispatchable == 'true'"
        uses: actions/upload-artifact@v4
        with:
          name: "agent-result-${{ github.event.issue.number }}"
          path: worker-result.json
          if-no-files-found: warn
      - name: Fail visibly when the live worker failed
        if: "always() && steps.deepseek-worker.outcome == 'failure'"
        run: exit 1
