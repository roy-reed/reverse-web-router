name: Agent integration gate

on:
  workflow_dispatch:
    inputs:
      integration_branch:
        description: Existing agent-integration branch to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-only:
    if: "inputs.integration_branch != 'main'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: "${{ inputs.integration_branch }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v
      - run: python .agent-orchestrator/scripts/validate_repo.py
      - name: Human merge boundary
        run: echo "Verification complete. This workflow never merges main."
