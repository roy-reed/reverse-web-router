name: Agent verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q .agent-orchestrator local-edge
      - name: Repository invariants
        run: python .agent-orchestrator/scripts/validate_repo.py
