name: Agent verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q .agent-orchestrator local-edge
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Syntax-check local-edge extension
        run: for f in local-edge/extension/*.js; do node --check "$f"; done
      - name: Extension behavior tests (node:test, mocked chrome API)
        run: node --test local-edge/extension/test/*.test.mjs
      - name: Repository invariants
        run: python .agent-orchestrator/scripts/validate_repo.py
